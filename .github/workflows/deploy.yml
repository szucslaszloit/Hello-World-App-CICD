name: Terraform + Deploy to Azure Web App

on:
  push:
    branches: [ "laci-fix" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (remote state)
        env:
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ secrets.TFSTATE_KEY }}" \
            -backend-config="access_key=${ARM_ACCESS_KEY}"

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      # Build app artifact (zip)
      - name: Create ZIP package
        run: |
          zip -r app.zip . \
            -x "*.git*" \
            -x ".terraform/*" \
            -x "*.tfstate*" \
            -x "app.zip"

      - name: Deploy ZIP to Web App
        run: |
          az webapp deployment source config-zip \
            --resource-group "${{ secrets.APP_RG }}" \
            --name "${{ secrets.WEBAPP_NAME }}" \
            --src app.zip
